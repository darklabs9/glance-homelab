<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Scan a document</title>
<!-- Scan from the phone straight into Paperless.
     Served on the same host as Paperless (e.g. https://paperless.example.lan/search/scan.html), so the browser
     session is enough (no token here). Photos are downscaled, then merged into ONE PDF (one page per photo)
     before upload. -->
<script src="config.js"></script>
<script src="common.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:hsl(225,14%,11%);--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.08);--hi:#eef1f6;--tx:#c3c8d2;--sub:#8b92a0;--pri:hsl(210,90%,64%);--ok:hsl(140,55%,58%);--ko:hsl(0,75%,66%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);text-decoration:none;font-size:14px;padding:6px 10px 6px 4px;border-radius:10px}
.back svg{width:18px;height:18px}
.top .lk{font-size:13px;color:var(--pri);text-decoration:none}

.hero{position:relative;border-radius:20px;padding:22px 20px 20px;overflow:hidden;color:#fff;
  background:linear-gradient(160deg,hsl(215,60%,34%),hsl(250,40%,30%) 60%,hsl(285,35%,28%))}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.hero p{margin:6px 0 18px;font-size:14px;color:rgba(255,255,255,.78);max-width:330px}
.shoot{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border:0;border-radius:16px;background:#fff;color:#141821;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:left;box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
.shoot .ic{flex:0 0 48px;height:48px;border-radius:14px;display:grid;place-items:center;background:hsl(215,85%,55%);color:#fff}
.shoot .ic svg{width:26px;height:26px}
.shoot small{display:block;font-size:12.5px;font-weight:500;color:#5b6472;margin-top:1px}
.shoot:active,.alt:active,.send:active{transform:scale(.985)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.sec span+span{letter-spacing:0;text-transform:none;font-weight:500}
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pg{position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);aspect-ratio:3/4}
.pg img{width:100%;height:100%;object-fit:cover;display:block}
.pg span{position:absolute;left:8px;bottom:8px;background:rgba(10,12,16,.72);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;backdrop-filter:blur(6px)}
.pg button{position:absolute;right:6px;top:6px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(10,12,16,.72);color:#fff;font-size:18px;line-height:30px;padding:0;cursor:pointer}
.pg.add{display:grid;place-items:center;border:1.5px dashed rgba(255,255,255,.18);background:transparent;color:var(--sub);cursor:pointer;font:inherit;font-size:13px;text-align:center}
.pg.add b{display:block;font-size:28px;font-weight:300;color:var(--hi);line-height:1}
.pdf{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.pdf .ic{flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center;background:hsla(0,70%,55%,.16);color:hsl(0,80%,72%);font-size:11px;font-weight:800}
.pdf b{color:var(--hi);font-weight:600;word-break:break-all}
.pdf button{margin-left:auto;border:0;background:none;color:var(--sub);font-size:22px;cursor:pointer}
.empty{padding:18px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.12);text-align:center;color:var(--sub);font-size:14px}

.alt{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--hi);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.alt svg{width:22px;height:22px;color:var(--pri);flex:0 0 auto}
.alt small{display:block;font-size:12px;font-weight:400;color:var(--sub)}

.fld{margin-top:4px;display:flex;align-items:center;gap:10px;padding:4px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.fld svg{width:18px;height:18px;color:var(--sub);flex:0 0 auto}
.fld input{flex:1;min-width:0;border:0;background:transparent;color:var(--hi);font:inherit;font-size:16px;padding:11px 0;outline:none}
.fld input::placeholder{color:var(--sub)}
.fld:focus-within{border-color:hsla(210,90%,64%,.6)}

#status{margin-top:16px;font-size:14.5px;line-height:1.45;border-radius:14px}
#status:empty{display:none}
#status{padding:12px 14px;background:var(--card);border:1px solid var(--line)}
#status.ok{color:var(--ok);background:hsla(140,55%,45%,.1);border-color:hsla(140,55%,45%,.3)}
#status.ko{color:var(--ko);background:hsla(0,70%,55%,.1);border-color:hsla(0,70%,55%,.3)}
#status a{color:var(--pri)}

.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.bar div{max-width:560px;margin:0 auto}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:0;border-radius:16px;background:var(--pri);color:#0b1420;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 12px 28px -14px hsla(210,90%,55%,.9)}
.send svg{width:20px;height:20px}
.send:disabled{background:rgba(255,255,255,.08);color:var(--sub);box-shadow:none;cursor:default}
input[type=file]{display:none}
[hidden]{display:none!important}
.top .lk{margin-left:auto}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" data-back href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg><span data-back-label>Back</span></a>
    <a class="lk" href="documents.html?inbox=1">Inbox ›</a>
  </div>

  <section class="hero">
    <h1>Scan a document</h1>
    <p>One photo per page. Everything goes to Paperless as a single PDF, which reads the text and files it for you.</p>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <input id="files" type="file" accept="image/*,application/pdf" multiple>
    <button class="shoot" id="bPhoto"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></span><span><span id="bPhotoTxt">Take a photo of a page</span><small id="bPhotoSub">opens the camera</small></span></button>
  </section>

  <div class="sec"><span>Pages</span><span id="nb"></span></div>
  <div id="pages"></div>

  <button class="alt" id="bFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Pick from the gallery<small>photos already taken, or a PDF</small></span></button>

  <div class="sec"><span>Title</span><span>optional</span></div>
  <label class="fld" for="title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg><input id="title" type="text" placeholder="e.g. Garage invoice, school report…" enterkeyhint="done"></label>

  <div id="status"></div>
</main>
<div class="bar"><div><button class="send" id="bSend" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span id="bSendTxt">Send to Paperless</span></button></div></div>
<script>
const pages = [];          // {dataUrl, w, h} downscaled photos
let directPdf = null;      // a PDF picked as is
const $ = id => document.getElementById(id);
const setStatus = (t, c) => { $("status").textContent = t; $("status").className = c || ""; };
PS.setupBackLinks();

function downscale(file) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const max = 1800, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok({dataUrl: c.toDataURL("image/jpeg", 0.82), w: c.width, h: c.height});
      URL.revokeObjectURL(img.src);
    };
    img.onerror = ko;
    img.src = URL.createObjectURL(file);
  });
}
function render() {
  const z = $("pages");
  if (directPdf) {
    z.className = "";
    z.innerHTML = `<div class="pdf"><div class="ic">PDF</div><div><b></b><div style="font-size:12px;color:var(--sub)">sent as is</div></div><button aria-label="Remove">×</button></div>`;
    z.querySelector("b").textContent = directPdf.name;
    z.querySelector("button").onclick = () => { directPdf = null; setStatus(""); render(); };
  } else if (pages.length) {
    z.className = "pages";
    z.innerHTML = pages.map((p, i) =>
      `<div class="pg"><img src="${p.dataUrl}" alt=""><span>${i + 1}</span><button data-i="${i}" aria-label="Remove">×</button></div>`).join("")
      + `<button class="pg add" id="bMore"><div><b>+</b>page ${pages.length + 1}</div></button>`;
    z.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { pages.splice(+b.dataset.i, 1); render(); });
    $("bMore").onclick = () => $("photo").click();
  } else {
    z.className = "";
    z.innerHTML = `<div class="empty">No page yet</div>`;
  }
  $("nb").textContent = directPdf ? "1 PDF" : pages.length ? pages.length + " page" + (pages.length > 1 ? "s" : "") : "";
  $("bPhotoTxt").textContent = pages.length ? "Add a page" : "Take a photo of a page";
  $("bPhotoSub").textContent = pages.length ? "page " + (pages.length + 1) : "opens the camera";
  $("bSend").disabled = !(pages.length || directPdf);
  $("bSendTxt").textContent = directPdf ? "Send the PDF to Paperless" : pages.length ? `Send ${pages.length} page${pages.length > 1 ? "s" : ""} to Paperless` : "Send to Paperless";
}
async function addFiles(list) {
  for (const f of list) {
    if (f.type === "application/pdf") { directPdf = f; pages.length = 0; continue; }
    try { pages.push(await downscale(f)); directPdf = null; } catch (e) { setStatus("This image could not be read.", "ko"); }
  }
  render();
}
$("bPhoto").onclick = () => $("photo").click();
$("bFile").onclick = () => $("files").click();
$("photo").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("files").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
// load jsPDF early so the send button works even if the connection drops afterwards
PS.loadScript(PS.cfg.jspdfUrl).catch(() => {});

$("bSend").onclick = async () => {
  $("bSend").disabled = true;
  setStatus("Preparing…");
  try {
    let blob, name;
    const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
    if (directPdf) { blob = directPdf; name = directPdf.name; }
    else {
      await PS.loadScript(PS.cfg.jspdfUrl);
      const { jsPDF } = window.jspdf;
      let doc = null;
      for (const p of pages) {
        const o = p.w > p.h ? "l" : "p";
        if (!doc) doc = new jsPDF({orientation: o, unit: "px", format: [p.w, p.h], compress: true});
        else doc.addPage([p.w, p.h], o);
        doc.addImage(p.dataUrl, "JPEG", 0, 0, p.w, p.h);
      }
      blob = doc.output("blob"); name = "scan-" + stamp + ".pdf";
    }
    setStatus("Uploading to Paperless…");
    await PS.ensureCsrf();
    const fd = new FormData();
    fd.append("document", blob, name);
    const t = $("title").value.trim();
    if (t) fd.append("title", t);
    const r = await fetch("/api/documents/post_document/", {method: "POST", body: fd, credentials: "same-origin",
                                                            headers: {"X-CSRFToken": PS.cookie("csrftoken")}});
    if (r.status === 401 || r.status === 403) throw "login";
    if (!r.ok) throw "error " + r.status;
    pages.length = 0; directPdf = null; $("title").value = ""; render();
    setStatus("Sent. Paperless reads and files it: it shows up in the inbox within a minute.", "ok");
  } catch (e) {
    $("bSend").disabled = false;
    if (e === "login") { $("status").className = "ko"; $("status").innerHTML = 'You are not logged in to Paperless in this browser. <a href="/" target="_blank">Open Paperless</a>, log in, then try again (your photos are kept).'; }
    else setStatus("Upload failed (" + e + "). Your photos are kept, try again.", "ko");
  }
};
render();
</script>
</body>
</html>
