<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document search</title>
<!-- Simple Paperless search that opens the PDF directly.
     Served by Caddy on the same host as Paperless (e.g. https://paperless.example.lan/search/), so the
     browser's Paperless session is enough: no token is stored here.
     A dashboard can send a query here with ?q=... -->
<script src="config.js"></script>
<script src="common.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2733;--sub:#667085;--line:#e4e7ec;--acc:#2f80d1;--acc-tx:#fff;--btn2:#eef2f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--card:#1f232a;--tx:#e8eaed;--sub:#98a2b3;--line:#2c313a;--acc:#5aa0e6;--acc-tx:#0d1117;--btn2:#2a2f38}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
form{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:2}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
button.go{font:inherit;font-weight:600;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-tx)}
#status{color:var(--sub);font-size:14px;margin:4px 2px 12px}
.doc{min-width:0;display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.doc img{width:64px;height:88px;object-fit:cover;border-radius:6px;background:var(--btn2);flex:0 0 auto}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.t{font-weight:650;overflow-wrap:anywhere}
.s{color:var(--sub);font-size:13px}
.h{color:var(--sub);font-size:13px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h b{background:hsla(45,95%,55%,.35);color:inherit;font-weight:600;border-radius:3px;padding:0 2px}
.b{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.b a{text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:10px;background:var(--btn2);color:var(--tx)}
.b a.pdf{background:var(--acc);color:var(--acc-tx)}
.b a.details{background:none;color:var(--sub);font-weight:500;padding:8px 4px}
a.link{color:var(--acc)}
a.go.scan{display:inline-flex;align-items:center;text-decoration:none;font-weight:600;padding:0 14px;border-radius:12px;background:var(--btn2);color:var(--tx)}
</style>
</head>
<body>
<main>
  <form id="f"><input id="q" type="search" placeholder="Search documents…" autocomplete="off" enterkeyhint="search"><button class="go">Search</button><a class="go scan" href="scan.html">Scan</a></form>
  <div id="status"></div>
  <div id="res"></div>
</main>
<script>
const q = document.getElementById("q"), statusEl = document.getElementById("status"), res = document.getElementById("res");
let correspondents = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Paperless returns highlights with <b> or <span class="match">: only those tags are let through
const highlight = s => esc(s).replace(/&lt;span class=&quot;match&quot;&gt;/g, "<b>").replace(/&lt;\/span&gt;/g, "</b>")
                             .replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
q.placeholder = PS.cfg.searchPlaceholder;

async function api(path) {
  const r = await fetch(path, {credentials: "same-origin", headers: {"Accept": "application/json"}});
  if (r.status === 401 || r.status === 403) throw "login";
  if (!r.ok) throw "error " + r.status;
  return r.json();
}
async function loadCorrespondents() {
  if (correspondents) return correspondents;
  correspondents = {};
  try { (await api("/api/correspondents/?page_size=1000&fields=id,name")).results.forEach(c => correspondents[c.id] = c.name); } catch (e) {}
  return correspondents;
}
async function search(text) {
  text = text.trim();
  history.replaceState(null, "", text ? "?q=" + encodeURIComponent(text) : location.pathname);
  res.innerHTML = "";
  if (!text) { statusEl.textContent = "Type a word: insurance, invoice, warranty…"; return; }
  statusEl.textContent = "Searching…";
  try {
    // always newest first
    const fields = "&page_size=100&fields=id,title,created,correspondent,__search_hit__&ordering=-created";
    let d = await api("/api/documents/?query=" + encodeURIComponent(text) + fields);
    // full-text search sometimes misses partial words: retry on title + content
    if (!d.count) d = await api("/api/documents/?title_content=" + encodeURIComponent(text) + fields);
    const c = await loadCorrespondents();
    statusEl.textContent = d.count ? d.count + " document" + (d.count > 1 ? "s" : "") + " · newest first" + (d.count > 100 ? " (latest 100)" : "") : "No document found.";
    res.innerHTML = d.results.map(x => {
      const date = PS.formatDate(x.created, true);
      const hl = x.__search_hit__ && x.__search_hit__.highlights;
      return `<div class="doc">
        <a href="viewer.html?id=${x.id}" target="_blank"><img loading="lazy" src="/api/documents/${x.id}/thumb/" alt=""></a>
        <div class="info"><div class="t">${esc(x.title)}</div>
          <div class="s">${esc([c[x.correspondent], date].filter(Boolean).join(" · "))}</div>
          ${hl ? `<div class="h">${highlight(hl)}</div>` : ""}
          <div class="b"><a class="pdf" href="viewer.html?id=${x.id}" target="_blank">View PDF</a>
            <a href="/api/documents/${x.id}/download/">Download</a>
            <a class="details" href="/documents/${x.id}/details" target="_blank">Details</a></div>
        </div></div>`;
    }).join("");
  } catch (e) {
    statusEl.innerHTML = e === "login"
      ? 'You are not logged in to Paperless in this browser. <a class="link" href="/" target="_blank">Open Paperless</a> once, log in, then come back.'
      : "Paperless is not answering (" + esc(e) + "). Try again in a moment.";
  }
}
document.getElementById("f").addEventListener("submit", ev => { ev.preventDefault(); q.blur(); search(q.value); });
q.value = new URLSearchParams(location.search).get("q") || "";
search(q.value);
if (!q.value) q.focus();
</script>
</body>
</html>
